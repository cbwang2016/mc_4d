[workspace]
resolver = "3"
members = ["crates/core", "crates/render", "crates/app"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
mc4d-core = { path = "crates/core" }
mc4d-render = { path = "crates/render" }
glam = { version = "0.34", features = ["bytemuck", "serde"] }
bytemuck = { version = "1", features = ["derive"] }
wgpu = "30"
winit = { version = "0.30", features = ["serde"] }
pollster = "0.4"
noise = "0.9"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
directories = "6"
log = "0.4"
env_logger = "0.11"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
